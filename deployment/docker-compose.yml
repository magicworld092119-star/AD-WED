version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: adweb-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: always

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ENV=production
      - DEBUG=False
      - MONGODB_URL=mongodb://mongodb:27017/adweb
      - MONGODB_DB_NAME=adweb
    volumes:
      - ../storage:/app/storage
    depends_on:
      - mongodb
    restart: always

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: always

volumes:
  mongodb_data:
